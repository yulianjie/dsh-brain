name: Feature request / 功能建议
description: Describe a use case and the desired behavior.
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case / 使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
      description: Include data scope, user controls, and alternatives where relevant.
    validations:
      required: true
